<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/azaman-logo.png" />
    <link rel="apple-touch-icon" href="/azaman-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f6f5" />
    <meta name="description" content="Azaman Admin Portal — Manage users, compliance, finance, Susu groups, and merchants." />
    <title>Azaman Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
    <script>
      // Admin portal defaults to LIGHT mode
      (function() {
        try {
          var saved = localStorage.getItem('az-dark-mode');
          var dark = saved !== null ? JSON.parse(saved) : false;
          if (dark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
