name: Apply guarded settings query contract repair

on:
  push:
    branches:
      - fix/typecheck-explicit-settings-types

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact query contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/useAdminData.js')
          text = path.read_text()
          old = "    queryFn: async () => {\n      const data = await financialApi.settings.get();\n      return data.settings;\n    },"
          new = "    queryFn: /** @returns {Promise<import('./settingsTypes').AdminSettings>} */ async () => {\n      const data = await financialApi.settings.get();\n      return data.settings;\n    },"
          if text.count(old) != 1:
              raise SystemExit(f'useAdminData: expected one untyped settings queryFn, found {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit source-only repair
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/lib/useAdminData.js
          git diff --cached --check
          git commit -m 'fix(typecheck): type global settings query result'
          git push origin HEAD:fix/typecheck-explicit-settings-types
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-settings-query-contract.yml
          git commit -m 'chore: remove temporary settings query repair workflow [skip ci]'
          git push origin HEAD:fix/typecheck-explicit-settings-types
