name: Temporary Mark Ready

on:
  push:
    branches:
      - fix/admin-force-release-409-refresh-20260831

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    if: ${{ !contains(github.event.head_commit.message, '[admin-force-release-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 17 --repo "$GITHUB_REPOSITORY"
      - name: Remove temporary workflow
        uses: actions/checkout@v4
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-mark-ready.yml
          git commit -m 'chore: remove temporary ready workflow [admin-force-release-ready]'
          git push origin HEAD:${GITHUB_REF_NAME}
