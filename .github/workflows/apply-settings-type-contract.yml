name: Apply settings type contract

on:
  push:
    branches:
      - fix/typecheck-admin-api-error-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply settings boundary types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          Path('src/lib/settingsTypes.d.ts').write_text('''import { z } from 'zod';\nimport { adminSettingsSchema, adminSettingsResponseSchema, adminSettingsUpdateSchema } from './settingsContracts';\n\nexport type AdminSettings = z.infer<typeof adminSettingsSchema>;\nexport type AdminSettingsResponse = z.infer<typeof adminSettingsResponseSchema>;\nexport type AdminSettingsUpdate = z.infer<typeof adminSettingsUpdateSchema>;\n''')

          replace_once('src/lib/financialApi.js',
              'get: async () => parse(adminSettingsResponseSchema, await settings.get()),',
              "get: /** @returns {Promise<import('./settingsTypes').AdminSettingsResponse>} */ async () => parse(adminSettingsResponseSchema, await settings.get()),")
          replace_once('src/lib/financialApi.js',
              'update: (data) => settings.update(parse(adminSettingsUpdateSchema, data)),',
              "update: /** @param {import('./settingsTypes').AdminSettingsUpdate} data */ (data) => settings.update(parse(adminSettingsUpdateSchema, data)),")
          PY

      - name: Validate tree and commit
        shell: bash
        run: |
          npm ci
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          set -e
          npm run build
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/apply-settings-type-contract.yml
          git diff --check
          git add src .github/workflows/ci.yml
          git commit -m 'fix(typecheck): type financial settings boundary'
          git push origin HEAD:fix/typecheck-admin-api-error-contract
