name: Fix withdrawal frozen response contract

on:
  push:
    branches: [fix/withdrawal-frozen-response-contract]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/withdrawal-frozen-response-contract
          fetch-depth: 1

      - name: Apply exact frozen response schema repair
        shell: bash
        run: |
          set -euo pipefail
          file=src/lib/financialContracts.js
          grep -Fq "frozen: z.array(withdrawalSchema)" "$file"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/financialContracts.js')
          s = p.read_text()
          old = "frozen: z.array(withdrawalSchema),"
          new = "frozen: z.array(z.object({\n      id: idSchema,\n      status: z.string(),\n      user: withdrawalUserSchema.nullable().optional(),\n    }).passthrough()),"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -Fq "frozen: z.array(z.object({" "$file"
          grep -Fq "status: z.string()," "$file"
          grep -Fq "user: withdrawalUserSchema.nullable().optional()," "$file"
          git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/financialContracts.js
          git diff --cached --check
          git diff --cached -- src/lib/financialContracts.js
          git commit -m "fix(financial): model frozen withdrawal history response"
          git push origin HEAD:fix/withdrawal-frozen-response-contract

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-withdrawal-frozen-contract.yml
          git commit -m "chore: remove temporary withdrawal contract workflow"
          git push origin HEAD:fix/withdrawal-frozen-response-contract
