name: Normalize FeeEngine form boundary

on:
  push:
    branches:
      - fix/typecheck-settings-contract-verify

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typecheck-settings-contract-verify
          fetch-depth: 0
      - name: Normalize FeeEngine form to strings
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/FeeEngine.jsx')
          text = p.read_text()
          replacements = [
            ("/** @typedef {Record<string, string | number>} FeeForm */", "/** @typedef {Record<string, string>} FeeForm */"),
            ("tierThreshold: serverSettings.tierThreshold,", "tierThreshold: String(serverSettings.tierThreshold),"),
            ("vendorMinCollateral: serverSettings.vendorMinCollateral,", "vendorMinCollateral: String(serverSettings.vendorMinCollateral),"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text)
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/pages/FeeEngine.jsx
          git diff --cached --check
          git commit -m 'fix(typecheck): normalize FeeEngine form values to strings'
          git push origin HEAD:fix/typecheck-settings-contract-verify
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git rm .github/workflows/normalize-fee-form.yml
          git commit -m 'chore: remove temporary FeeEngine normalization workflow [skip ci]'
          git push origin HEAD:fix/typecheck-settings-contract-verify
