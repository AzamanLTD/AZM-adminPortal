name: Fix FeeEngine remaining type unions

on:
  push:
    branches:
      - fix/typecheck-settings-contract-verify

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typecheck-settings-contract-verify
          fetch-depth: 0
      - name: Patch exact expressions
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/FeeEngine.jsx')
          text = p.read_text()
          pairs = [
            ('cryptoPlatformFeePct: asPct(form.cryptoPlatformFeePct || 0),', 'cryptoPlatformFeePct: asPct(String(form.cryptoPlatformFeePct || 0)),'),
            ('const vendorUnder = parseFloat(form.vendorShareUnder1k || 0);', 'const vendorUnder = parseFloat(String(form.vendorShareUnder1k || 0));'),
            ('const vendorOver = parseFloat(form.vendorShareOver1k || 0);', 'const vendorOver = parseFloat(String(form.vendorShareOver1k || 0));'),
          ]
          for old, new in pairs:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected one match for {old!r}, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Missing expected expression: {old!r}')
          p.write_text(text)
      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/pages/FeeEngine.jsx
          git diff --cached --check
          git commit -m 'fix(typecheck): normalize FeeEngine numeric fallbacks'
          git push origin HEAD:fix/typecheck-settings-contract-verify
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git rm .github/workflows/fix-fee-unions.yml
          git commit -m 'chore: remove temporary FeeEngine union fix workflow [skip ci]'
          git push origin HEAD:fix/typecheck-settings-contract-verify
