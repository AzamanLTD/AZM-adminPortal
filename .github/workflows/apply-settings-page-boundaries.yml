name: Apply settings page boundary repairs

on:
  push:
    branches:
      - fix/typecheck-settings-contract-verify

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source repairs
        shell: python
        run: |
          from pathlib import Path
          import sys

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          # Config: make the checked page's local settings query explicit.
          config = Path('src/pages/Config.jsx')
          text = config.read_text()
          typedef = "/** @typedef {import('@/types/adminSettings').AdminSettings} AdminSettings */"
          marker = "import { Smartphone, Zap, Bot, DollarSign, Shield, CheckCircle2, Loader2, RefreshCw } from 'lucide-react';\n"
          if typedef not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Config.jsx: unique Lucide import marker not found')
              text = text.replace(marker, marker + "\n" + typedef + "\n")
          old = "queryFn: () => financialApi.settings.get().catch(() => ({ settings: { susuProfitPct: 0.03, liveUsdToGhs: 15.2, liveRateSource: 'AZM_ADMIN_MOCK', lastRateSync: null }, _error: true }))"
          new = "queryFn: /** @returns {Promise<{ settings: Pick<AdminSettings, 'susuProfitPct' | 'liveUsdToGhs' | 'liveRateSource' | 'lastRateSync'>, _error?: boolean }>} */ () => financialApi.settings.get().catch(() => ({ settings: { susuProfitPct: 0.03, liveUsdToGhs: 15.2, liveRateSource: 'AZM_ADMIN_MOCK', lastRateSync: null }, _error: true }))"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Config.jsx: expected exactly one global settings query, found {count}')
          config.write_text(text.replace(old, new))

          # FeeEngine: make the checked page consume the included contract and
          # preserve numeric/percentage semantics while satisfying parseFloat.
          fee = Path('src/pages/FeeEngine.jsx')
          text = fee.read_text()
          typedef = "/** @typedef {import('@/types/adminSettings').AdminSettings} AdminSettings */"
          marker = "import { Calculator, Save, AlertTriangle, TrendingUp, RotateCcw, History, BarChart3, Clock, ArrowUp, ArrowDown } from 'lucide-react';\n"
          if typedef not in text:
              if text.count(marker) != 1:
                  raise SystemExit('FeeEngine.jsx: unique Lucide import marker not found')
              text = text.replace(marker, marker + "\n" + typedef + "\n")
          old = "function pct(v) { return (parseFloat(v) * 100).toFixed(2); }"
          new = "function pct(v) { return (parseFloat(String(v)) * 100).toFixed(2); }"
          if text.count(old) != 1:
              raise SystemExit('FeeEngine.jsx: pct helper not found exactly once')
          text = text.replace(old, new)
          old = "const oldP2pFee = parseFloat(form.p2pFeePct || 2) / 100;"
          new = "const oldP2pFee = parseFloat(String(form.p2pFeePct || 2)) / 100;"
          if text.count(old) != 1:
              raise SystemExit('FeeEngine.jsx: oldP2pFee expression not found exactly once')
          text = text.replace(old, new)
          old = "  const { data: serverSettingsRaw, isLoading } = useGlobalSettings();\n  /** @type {import('@/lib/settingsTypes').AdminSettings | undefined} */\n  const serverSettings = serverSettingsRaw;"
          new = "  const globalSettings = useGlobalSettings();\n  const { isLoading } = globalSettings;\n  /** @type {AdminSettings | undefined} */\n  const serverSettings = globalSettings.data;"
          if text.count(old) != 1:
              raise SystemExit('FeeEngine.jsx: server settings boundary not found exactly once')
          text = text.replace(old, new)
          fee.write_text(text)

          # WarRoom: buyerPct is already numeric state; do not parseInt it as a string.
          replace_once('src/pages/WarRoom.jsx', 'buyerPercent: parseInt(buyerPct)', 'buyerPercent: buyerPct')

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git diff --check
          git add src/pages/Config.jsx src/pages/FeeEngine.jsx src/pages/WarRoom.jsx
          git diff --cached --check
          git commit -m 'fix(typecheck): type settings consumers and numeric ruling state'
          git push origin HEAD:fix/typecheck-settings-contract-verify

      - name: Remove temporary repair workflow
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git rm .github/workflows/apply-settings-page-boundaries.yml
          git commit -m 'chore: remove temporary settings page repair workflow [skip ci]'
          git push origin HEAD:fix/typecheck-settings-contract-verify
