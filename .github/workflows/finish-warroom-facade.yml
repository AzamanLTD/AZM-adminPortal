name: Finish WarRoom financial facade

on:
  push:
    branches: [fix/admin-warroom-financial-facade]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-warroom-financial-facade
          fetch-depth: 1

      - name: Apply exact guarded migration
        shell: bash
        run: |
          set -euo pipefail
          file=src/pages/WarRoom.jsx
          grep -Fq "import { financialApi } from '@/lib/financialApi';" "$file"
          grep -Fq "api.trades.resolve(String(id), ruling, reason, buyerPercent, override)" "$file"
          grep -Fq "api.trades.injectMessage(String(id), message)" "$file"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/WarRoom.jsx')
          s = p.read_text()
          old_release = "financialApi.disputes.forceRelease(id, reason)"
          old_cancel = "financialApi.disputes.forceCancel(id, reason)"
          s = s.replace("import { financialApi } from '@/lib/financialApi';", "import { financialApi } from '@/lib/financialApi';\nimport api from '@/lib/api';", 1)
          s = s.replace("api.trades.resolve(String(id), ruling, reason, buyerPercent, override)", "financialApi.disputes.resolve(id, ruling, reason, buyerPercent, override)", 1)
          s = s.replace("api.trades.injectMessage(String(id), message)", "financialApi.disputes.injectMessage(id, message)", 1)
          p.write_text(s)
          PY
          grep -Fq "import api from '@/lib/api';" "$file"
          grep -Fq "financialApi.disputes.resolve(id, ruling, reason, buyerPercent, override)" "$file"
          grep -Fq "financialApi.disputes.injectMessage(id, message)" "$file"
          git diff --check

      - name: Commit source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/WarRoom.jsx
          git diff --cached --check
          git diff --cached -- src/pages/WarRoom.jsx
          git commit -m "fix(typecheck): route remaining WarRoom trade actions through facade"
          git push origin HEAD:fix/admin-warroom-financial-facade

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-warroom-facade.yml
          git commit -m "chore: remove temporary WarRoom facade workflow"
          git push origin HEAD:fix/admin-warroom-financial-facade
