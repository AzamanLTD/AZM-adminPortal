name: Repair FeeEngine form type

on:
  push:
    branches:
      - fix/typecheck-settings-contract-verify

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typecheck-settings-contract-verify
          fetch-depth: 0
      - name: Patch only FeeEngine form state
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/FeeEngine.jsx')
          text = p.read_text()
          old = "/** @typedef {import('@/types/adminSettings').AdminSettings} AdminSettings */\n"
          marker = old + "\nfunction pct(v)"
          if "@typedef {Record<string, string | number>} FeeForm" not in text:
              if marker not in text:
                  raise SystemExit('FeeEngine markers not found')
              text = text.replace(marker, old + "/** @typedef {Record<string, string | number>} FeeForm */\n\nfunction pct(v)", 1)
          old_state = "  const [form, setForm] = useState({});"
          new_state = "  const [form, setForm] = useState(/** @type {FeeForm} */ ({}));"
          if old_state in text:
              if text.count(old_state) != 1:
                  raise SystemExit(f'Expected one form state initializer, found {text.count(old_state)}')
              text = text.replace(old_state, new_state, 1)
          elif new_state not in text:
              raise SystemExit('FeeEngine form state initializer not found')
          p.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/pages/FeeEngine.jsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch needed'
          else
            git commit -m 'fix(typecheck): type FeeEngine form state'
            git push origin HEAD:fix/typecheck-settings-contract-verify
          fi
      - name: Remove repair workflow
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git rm .github/workflows/repair-fee-form-type.yml
          git commit -m 'chore: remove temporary fee form repair workflow [skip ci]'
          git push origin HEAD:fix/typecheck-settings-contract-verify
