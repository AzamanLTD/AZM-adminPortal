name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck diagnostic
        run: npm run typecheck

      - name: Lint changed JavaScript/TypeScript files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs npx eslint --quiet
          else
            echo "No changed JavaScript/TypeScript files to lint."
          fi

      - name: Build
        run: npm run build
