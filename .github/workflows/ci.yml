name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed JavaScript/TypeScript files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs npx eslint --quiet
          else
            echo "No changed JavaScript/TypeScript files to lint."
          fi

      - name: Apply verified settings page type repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text and old not in text:
                  return False
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new))
              return True

          config = Path('src/pages/Config.jsx')
          text = config.read_text()
          typedef = "/** @typedef {import('@/types/adminSettings').AdminSettings} AdminSettings */"
          marker = "import { Smartphone, Zap, Bot, DollarSign, Shield, CheckCircle2, Loader2, RefreshCw } from 'lucide-react';\n"
          if typedef not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Config.jsx: unique Lucide import marker not found')
              text = text.replace(marker, marker + "\n" + typedef + "\n")
          old = "queryFn: () => financialApi.settings.get().catch(() => ({ settings: { susuProfitPct: 0.03, liveUsdToGhs: 15.2, liveRateSource: 'AZM_ADMIN_MOCK', lastRateSync: null }, _error: true }))"
          new = "queryFn: /** @returns {Promise<{ settings: Pick<AdminSettings, 'susuProfitPct' | 'liveUsdToGhs' | 'liveRateSource' | 'lastRateSync'>, _error?: boolean }>} */ () => financialApi.settings.get().catch(() => ({ settings: { susuProfitPct: 0.03, liveUsdToGhs: 15.2, liveRateSource: 'AZM_ADMIN_MOCK', lastRateSync: null }, _error: true }))"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Config.jsx: global settings query count {text.count(old)}')
              text = text.replace(old, new)
          config.write_text(text)

          fee = Path('src/pages/FeeEngine.jsx')
          text = fee.read_text()
          typedef = "/** @typedef {import('@/types/adminSettings').AdminSettings} AdminSettings */"
          marker = "import { Calculator, Save, AlertTriangle, TrendingUp, RotateCcw, History, BarChart3, Clock, ArrowUp, ArrowDown } from 'lucide-react';\n"
          if typedef not in text:
              if text.count(marker) != 1:
                  raise SystemExit('FeeEngine.jsx: unique Lucide import marker not found')
              text = text.replace(marker, marker + "\n" + typedef + "\n")
          replacements = [
              ("function pct(v) { return (parseFloat(v) * 100).toFixed(2); }", "function pct(v) { return (parseFloat(String(v)) * 100).toFixed(2); }"),
              ("const oldP2pFee = parseFloat(form.p2pFeePct || 2) / 100;", "const oldP2pFee = parseFloat(String(form.p2pFeePct || 2)) / 100;"),
              ("  const { data: serverSettingsRaw, isLoading } = useGlobalSettings();\n  /** @type {import('@/lib/settingsTypes').AdminSettings | undefined} */\n  const serverSettings = serverSettingsRaw;", "  const globalSettings = useGlobalSettings();\n  const { isLoading } = globalSettings;\n  /** @type {AdminSettings | undefined} */\n  const serverSettings = globalSettings.data;"),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'FeeEngine.jsx: expected one match for {old!r}, found {text.count(old)}')
                  text = text.replace(old, new)
          fee.write_text(text)

          war = Path('src/pages/WarRoom.jsx')
          text = war.read_text()
          old, new = 'buyerPercent: parseInt(buyerPct)', 'buyerPercent: buyerPct'
          if old in text:
              if text.count(old) != 2:
                  raise SystemExit(f'WarRoom.jsx: expected two buyerPct parse sites, found {text.count(old)}')
              text = text.replace(old, new)
          war.write_text(text)

      - name: Commit page repairs back to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/pages/Config.jsx src/pages/FeeEngine.jsx src/pages/WarRoom.jsx
          if git diff --cached --quiet; then
            echo "No page repairs needed."
          else
            git diff --cached --check
            git commit -m 'fix(typecheck): type settings consumers and numeric ruling state'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Diagnostic typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
