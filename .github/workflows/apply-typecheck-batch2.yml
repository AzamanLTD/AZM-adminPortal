name: Apply targeted CI cleanup

on:
  push:
    branches:
      - fix/typecheck-admin-api-error-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove imports proven unused by CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Businesses.jsx')
          text = p.read_text()
          replacements = {
              "import { Button, Input, Textarea, Dialog, DialogContent, DialogHeader, DialogTitle, Tag } from '@/components/forge';":
                  "import { Button, Input, Textarea, Dialog, DialogContent, DialogHeader, DialogTitle } from '@/components/forge';",
              "import { Building2, Ban, CheckCircle2, Search, FileCheck, ChevronLeft, ChevronRight, Eye, Hotel, UtensilsCrossed, Bus, ArrowRight } from 'lucide-react';":
                  "import { Building2, Ban, CheckCircle2, Search, FileCheck, ChevronLeft, ChevronRight, Eye, Hotel, UtensilsCrossed, Bus } from 'lucide-react';",
              "import { cn } from '@/lib/utils';\n": "",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Businesses.jsx: expected exactly one match for cleanup, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Validate lint and build
        run: |
          npm ci
          npx eslint --quiet src/pages/Businesses.jsx
          npm run build

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/apply-typecheck-batch2.yml
          git diff --check
          git add src .github/workflows/ci.yml
          git commit -m 'fix: clean unused Businesses imports'
          git push origin HEAD:fix/typecheck-admin-api-error-contract
