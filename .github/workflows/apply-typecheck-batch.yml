name: Apply typecheck batch

on:
  push:
    branches:
      - fix/typecheck-admin-api-error-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused root-cause fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          # FeeEngine: the active confirmation state belongs to PaymentMethodsManager,
          # so keep the dialog inside that component and use the actual Forge primitive.
          replace_once('src/pages/FeeEngine.jsx', "import { Button } from '@/components/forge';", "import { Button, ConfirmDestructive } from '@/components/forge';")
          outer = '''      <ConfirmDestructive\n        open={!!removeKey}\n        title="Remove Payout Method"\n        body={removeKey ? `Remove ${removeKey}? Vendors with this method will need to update their accounts.` : ''}\n        confirmLabel="Remove"\n        onConfirm={confirmRemoveMethod}\n        onClose={() => setRemoveKey(null)}\n      />\n'''
          replace_once('src/pages/FeeEngine.jsx', outer, '')
          inner = '''      <ConfirmDialog\n        open={!!removeKey}\n        title="Remove Payout Method"\n        message={removeKey ? `Remove ${removeKey}? Vendors with this method will need to update their accounts.` : ''}\n        confirmLabel="Remove"\n        variant="destructive"\n        onConfirm={confirmRemoveMethod}\n        onCancel={() => setRemoveKey(null)}\n      />\n'''
          replace_once('src/pages/FeeEngine.jsx', inner, '''      <ConfirmDestructive\n        open={!!removeKey}\n        title="Remove Payout Method"\n        body={removeKey ? `Remove ${removeKey}? Vendors with this method will need to update their accounts.` : ''}\n        confirmLabel="Remove"\n        loading={false}\n        onConfirm={confirmRemoveMethod}\n        onClose={() => setRemoveKey(null)}\n      />\n''')

          # FeeEngine should consume the already-validated financial settings boundary.
          replace_once('src/lib/useAdminData.js', "import { financialApi } from './financialApi';", "import { financialApi } from './financialApi';")
          replace_once('src/lib/useAdminData.js', '''export function useGlobalSettings() {\n  return useQuery({\n    queryKey: ['admin', 'settings'],\n    queryFn: async () => {\n      const data = await api.settings.get();\n      return data.settings || data;\n    },\n  });\n}''', '''export function useGlobalSettings() {\n  return useQuery({\n    queryKey: ['admin', 'settings'],\n    queryFn: async () => {\n      const data = await financialApi.settings.get();\n      return data.settings;\n    },\n  });\n}''')

          # FeeProfiles form boundary: preserve string form state before parseFloat.
          replace_once('src/pages/FeeProfiles.jsx', "setF('vendorSplitPct', (100 - parseFloat(e.target.value || 0)).toFixed(2));", "setF('vendorSplitPct', (100 - parseFloat(String(e.target.value || '0'))).toFixed(2));")
          replace_once('src/pages/FeeProfiles.jsx', "setF('adminSplitPct', (100 - parseFloat(e.target.value || 0)).toFixed(2));", "setF('adminSplitPct', (100 - parseFloat(String(e.target.value || '0'))).toFixed(2));")

          # Storefronts: mutate variables and DOM event target are explicit at the browser boundary.
          replace_once('src/pages/Storefronts.jsx',
              'mutationFn: ({ businessProfileId, versionId }) => sfApi.revert(businessProfileId, versionId),',
              'mutationFn: /** @param {{ businessProfileId: string | number, versionId: string | number }} data */ ({ businessProfileId, versionId }) => sfApi.revert(businessProfileId, versionId),')
          replace_once('src/pages/Storefronts.jsx',
              'mutationFn: sfApi.disable,',
              "mutationFn: /** @param {string | number} businessProfileId */ (businessProfileId) => sfApi.disable(businessProfileId),")
          replace_once('src/pages/Storefronts.jsx',
              'mutationFn: sfApi.enable,',
              "mutationFn: /** @param {string | number} businessProfileId */ (businessProfileId) => sfApi.enable(businessProfileId),")
          replace_once('src/pages/Storefronts.jsx',
              'mutationFn: ({ businessProfileId, versionId }) => sfApi.revert(businessProfileId, versionId),',
              'mutationFn: /** @param {{ businessProfileId: string | number, versionId: string | number }} data */ ({ businessProfileId, versionId }) => sfApi.revert(businessProfileId, versionId),')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          npm ci
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          set -e
          npm run build
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/apply-typecheck-batch.yml
          git diff --check
          git add src .github/workflows/ci.yml
          git commit -m 'fix(typecheck): repair shared settings and page boundaries'
          git push origin HEAD:fix/typecheck-admin-api-error-contract
