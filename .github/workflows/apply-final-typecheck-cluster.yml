name: Apply final typecheck cluster repair

on:
  push:
    branches:
      - fix/typecheck-final-contract-cluster

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded source repairs
        shell: python
        run: |
          from pathlib import Path

          changes = {
            'src/pages/BusinessDetail.jsx': [
              ("qc.invalidateQueries(['admin-business-detail', bizId])",
               "qc.invalidateQueries({ queryKey: ['admin-business-detail', bizId] })", 1),
            ],
            'src/pages/WarRoom.jsx': [
              ("api.trades.forceRelease(id, reason)",
               "api.trades.forceRelease(String(id), reason)", 1),
              ("api.trades.forceCancel(id, reason)",
               "api.trades.forceCancel(String(id), reason)", 1),
            ],
            'src/pages/FeeEngine.jsx': [
              ("function ProjectedRevenue({ form, dirty, liveSettings }) {",
               "/** @param {{ form: Record<string, string | number>, dirty: boolean, liveSettings: { p2pFeePct: number, bankMargin: number, thirdPartyMargin: number, vendorShareUnder1k: number, vendorShareOver1k: number, tierThreshold: string | number, fiatWithdrawalFeePct: number, cryptoWithdrawalFeePct: number, cryptoPlatformFeePct: number } }} props */\nfunction ProjectedRevenue({ form, dirty, liveSettings }) {",
               1),
            ],
          }

          for filename, rules in changes.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{filename}: expected {expected} occurrence(s) of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)

      - name: Validate formatting and build
        run: |
          npm ci
          npx eslint src/pages/BusinessDetail.jsx src/pages/WarRoom.jsx src/pages/FeeEngine.jsx
          npm run build

      - name: Commit source-only repair
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/pages/BusinessDetail.jsx src/pages/WarRoom.jsx src/pages/FeeEngine.jsx
          git diff --cached --check
          git diff --cached --name-only | grep -Fx 'src/pages/BusinessDetail.jsx'
          git diff --cached --name-only | grep -Fx 'src/pages/WarRoom.jsx'
          git diff --cached --name-only | grep -Fx 'src/pages/FeeEngine.jsx'
          git commit -m 'fix(typecheck): close final page contract cluster'
          git push origin HEAD:fix/typecheck-final-contract-cluster

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-final-typecheck-cluster.yml
          git commit -m 'chore: remove temporary repair workflow [skip ci]'
          git push origin HEAD:fix/typecheck-final-contract-cluster
