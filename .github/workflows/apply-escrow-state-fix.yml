name: Apply guarded escrow state type repair

on:
  push:
    branches:
      - fix/typecheck-escrow-state-boundaries

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/EscrowDisputes.jsx')
          text = path.read_text()
          old = 'parseInt(payerPct, 10)'
          count = text.count(old)
          if count != 6:
              raise SystemExit(f'EscrowDisputes: expected 6 payerPct parseInt calls, found {count}')
          text = text.replace(old, 'Number(payerPct)')
          path.write_text(text)

          path = Path('src/pages/WarRoom.jsx')
          text = path.read_text()
          replacements = [
            ("tradeId: dispute.id", "tradeId: String(dispute.id)"),
            ("forceRelease.mutate({ id: dispute.id, reason: reasonText })", "forceRelease.mutate({ id: String(dispute.id), reason: reasonText })"),
            ("forceCancel.mutate({ id: dispute.id, reason: reasonText })", "forceCancel.mutate({ id: String(dispute.id), reason: reasonText })"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'WarRoom: expected exactly 1 occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)

      - name: Validate
        run: |
          npm ci
          npx eslint src/pages/EscrowDisputes.jsx src/pages/WarRoom.jsx
          npm run build

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'Taimako Shamsudeen Abdul-Mumin Sugru'
          git config user.email '57481825+pyraxxz@users.noreply.github.com'
          git add src/pages/EscrowDisputes.jsx src/pages/WarRoom.jsx
          git diff --cached --check
          git diff --cached --name-only | grep -Fx 'src/pages/EscrowDisputes.jsx'
          git diff --cached --name-only | grep -Fx 'src/pages/WarRoom.jsx'
          git commit -m 'fix(typecheck): normalize escrow dispute state values'
          git push origin HEAD:fix/typecheck-escrow-state-boundaries

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-escrow-state-fix.yml
          git commit -m 'chore: remove temporary escrow repair workflow [skip ci]'
          git push origin HEAD:fix/typecheck-escrow-state-boundaries
