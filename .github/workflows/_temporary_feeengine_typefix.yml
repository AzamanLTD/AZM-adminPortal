name: Temporary FeeEngine typecheck fix

on:
  push:
    branches: [fix/typecheck-feeengine-confirmation-scope]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[feeengine-typefix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused FeeEngine correction
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/FeeEngine.jsx')
          text = path.read_text()

          block = '''      <ConfirmDialog
            open={!!removeKey}
            title="Remove Payout Method"
            message={removeKey ? `Remove ${removeKey}? Vendors with this method will need to update their accounts.` : ''}
            confirmLabel="Remove"
            variant="destructive"
            onConfirm={confirmRemoveMethod}
            onCancel={() => setRemoveKey(null)}
          />
'''

          assert text.count(block) == 4, f'Expected 4 legacy ConfirmDialog blocks, found {text.count(block)}'
          text = text.replace(block, '', 3)

          legacy = block
          replacement = '''      <ConfirmDestructive
            open={!!removeKey}
            title="Remove Payout Method"
            body={removeKey ? `Remove ${removeKey}? Vendors with this method will need to update their accounts.` : ''}
            confirmLabel="Remove"
            onConfirm={confirmRemoveMethod}
            onClose={() => setRemoveKey(null)}
          />
'''
          assert legacy in text, 'Expected PaymentMethodsManager confirmation block after removing out-of-scope copies'
          text = text.replace(legacy, replacement, 1)

          old_import = "import { Button } from '@/components/forge';"
          new_import = "import { Button, ConfirmDestructive } from '@/components/forge';"
          assert text.count(old_import) == 1, 'Unexpected forge Button import count'
          text = text.replace(old_import, new_import, 1)

          assert 'ConfirmDialog' not in text, 'Legacy ConfirmDialog reference remains'
          assert text.count('ConfirmDestructive') == 2, 'Expected one import and one scoped confirmation component'

          path.write_text(text)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/FeeEngine.jsx
          git rm .github/workflows/_temporary_feeengine_typefix.yml
          git commit -m 'fix(typecheck): correct FeeEngine confirmation scope [feeengine-typefix]'
          git push origin HEAD:fix/typecheck-feeengine-confirmation-scope
