name: Fix admin notes transport

on:
  push:
    branches: [fix/admin-warroom-financial-facade]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-warroom-financial-facade
          fetch-depth: 1

      - name: Apply exact transport mapping
        shell: bash
        run: |
          set -euo pipefail
          file=src/lib/api.js
          grep -Fq "forceRelease: (tradeId, reason) => request('/api/admin/disputes/force-release'" "$file"
          grep -Fq "forceCancel: (tradeId, reason) => request('/api/admin/disputes/force-cancel'" "$file"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/api.js')
          s = p.read_text()
          old1 = "forceRelease: (tradeId, reason) => request('/api/admin/disputes/force-release', { method: 'POST', body: JSON.stringify({ tradeId, reason }) }),"
          new1 = "forceRelease: (tradeId, reason) => request('/api/admin/disputes/force-release', { method: 'POST', body: JSON.stringify({ tradeId, adminNotes: reason }) }),"
          old2 = "forceCancel: (tradeId, reason) => request('/api/admin/disputes/force-cancel', { method: 'POST', body: JSON.stringify({ tradeId, reason }) }),"
          new2 = "forceCancel: (tradeId, reason) => request('/api/admin/disputes/force-cancel', { method: 'POST', body: JSON.stringify({ tradeId, adminNotes: reason }) }),"
          assert s.count(old1) == 1
          assert s.count(old2) == 1
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          grep -Fq "JSON.stringify({ tradeId, adminNotes: reason })" "$file"
          git diff --check

      - name: Commit transport fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api.js
          git diff --cached --check
          git diff --cached -- src/lib/api.js
          git commit -m "fix(financial): preserve admin notes in dispute actions"
          git push origin HEAD:fix/admin-warroom-financial-facade

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-admin-notes-transport.yml
          git commit -m "chore: remove temporary admin notes transport workflow"
          git push origin HEAD:fix/admin-warroom-financial-facade
