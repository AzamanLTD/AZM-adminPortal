# =============================================================================
# Render Blueprint — azaman-admin-portal (static site)
# DEPRECATED: This service is now deployed on Vercel at https://azm-admin-portal.vercel.app
# This file is kept for reference only. Vercel deployment uses vercel.json + dashboard env vars.
#
# Build Command:  npm run build
# Publish Dir:    dist
# =============================================================================
services:
  - type: web
    name: azaman-admin-portal
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend API URL — no trailing slash
      - key: VITE_API_URL
        value: "https://azm-backend.onrender.com"
